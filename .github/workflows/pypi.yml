name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dexalot-sdk
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          pyproject = pathlib.Path("pyproject.toml")
          data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
          version = data["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{version}"

          if tag != expected_tag:
              raise SystemExit(
                  f"Refusing to publish: git tag {tag!r} does not match project version {expected_tag!r}"
              )

          print(f"Publishing dexalot-sdk version {version} from tag {tag}")
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # Defense-in-depth: refuse to publish if any production dep has a known
      # CVE.  CI runs the same audit on every PR (.github/workflows/ci.yml),
      # but a vulnerability can be disclosed between the last green PR and the
      # release tag — this step closes that window.
      - name: Pre-publish dependency CVE audit (pip-audit)
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit --strict

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
