[mypy]
python_version = 3.12
python_executable = .venv/bin/python
mypy_path = src
files = src, tests
explicit_package_bases = True
incremental = False

# Keep defaults a bit strict but not painful
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Reasonable default leniency for evolving codebases
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = False

# Tests use dynamic mocks, patches, and Result.error narrowing mypy does not infer.
[mypy-tests.*]
disable_error_code = attr-defined, method-assign, union-attr, misc, assignment, arg-type, var-annotated
