[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexalot-sdk"
license = "MIT"
license-files = [
    "LICENSE.txt"
]
version = "0.5.12"
description = "Dexalot Python SDK - Core library for Dexalot interaction"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Dexalot" }
]
keywords = ["dexalot", "dex", "defi", "web3", "trading", "avalanche"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "web3>=6.0.0,<8",
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "eth-account>=0.11,<1",
    "websockets>=13.0,<15",
    "cryptography>=46,<48",
]

[project.urls]
Homepage = "https://dexalot.com"
Documentation = "https://docs.dexalot.com"
Repository = "https://github.com/Dexalot/dexalot-sdk-python"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "twine",
]

docs = [
    "mkdocstrings[python]>=0.29",
    "zensical>=0.0.29",
]

# Security audit tooling — kept out of `dev` so a normal contributor install
# stays lean.  CI installs this group explicitly via `uv sync --group security`.
security = [
    "bandit[toml]",
    "pip-audit",
]

[project.scripts]
secrets-vault = "dexalot_sdk.scripts.secrets_vault_cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "data/*.json", "py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "W", "C901"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 15

# bandit configuration — used by `make security` and the CI security gate.
# Skip rules that don't apply to a typed library: assert_used (we use asserts
# in tests only), and try_except_pass (intentional in some retry paths).
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".venv-py313", ".venv-py314", "site", "dist", "docs"]
skips = ["B101", "B110"]
