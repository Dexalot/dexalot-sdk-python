[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexalot-sdk"
version = "0.4.0"
description = "Dexalot Python SDK - Core library for Dexalot interaction"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "web3>=6.0.0",
    "aiohttp",
    "python-dotenv",
    "eth-account",
    "websocket-client",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.setuptools]
packages = ["dexalot_sdk", "dexalot_sdk.core", "dexalot_sdk.utils", "dexalot_sdk.scripts"]
package-dir = {"dexalot_sdk" = "src/dexalot_sdk", "dexalot_sdk.scripts" = "scripts"}

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "W", "C901"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 15
