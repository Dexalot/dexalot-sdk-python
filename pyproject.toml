[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexalot-sdk"
license = "MIT"
license-files = [
    "LICENSE.txt"
]
version = "0.5.12"
description = "Dexalot Python SDK - Core library for Dexalot interaction"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Dexalot" }
]
keywords = ["dexalot", "dex", "defi", "web3", "trading", "avalanche"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "web3>=6.0.0,<8",
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "eth-account>=0.11,<1",
    "websockets>=13.0,<15",
    "cryptography>=43,<45",
]

[project.urls]
Homepage = "https://dexalot.com"
Documentation = "https://docs.dexalot.com"
Repository = "https://github.com/Dexalot/dexalot-sdk-python"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "twine",
]

docs = [
    "mkdocstrings[python]>=0.29",
    "zensical>=0.0.29",
]

[project.scripts]
secrets-vault = "dexalot_sdk.scripts.secrets_vault_cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "data/*.json", "py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "W", "C901"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 15
