[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexalot-sdk"
version = "0.5.6"
description = "Dexalot Python SDK - Core library for Dexalot interaction"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "web3>=6.0.0,<8",
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "eth-account>=0.11,<1",
    "websockets>=13.0,<15",
    "cryptography>=43,<45",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

docs = [
    "mkdocstrings[python]>=0.29",
    "zensical>=0.0.29",
]

[project.scripts]
secrets-vault = "dexalot_sdk.scripts.secrets_vault_cli:main"

[tool.setuptools]
packages = ["dexalot_sdk", "dexalot_sdk.core", "dexalot_sdk.utils", "dexalot_sdk.scripts"]
package-dir = {"dexalot_sdk" = "src/dexalot_sdk", "dexalot_sdk.scripts" = "scripts"}

[tool.setuptools.package-data]
"*" = ["*.json", "data/*.json", "py.typed"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "W", "C901"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 15
